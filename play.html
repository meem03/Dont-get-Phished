<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="shortcut icon" type="x-icon" href="assets/images/fish-logo2.png">
  <title>Do not get Phished!</title>
  <link rel="stylesheet" href="style.css" /><link rel="stylesheet" href="responsive.css" />
  <link rel="preload" href="assets/fonts/pixelon/Pixelon.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="game.css" />
  <script src="music.js" defer></script>
</head>
<body class="game-page">
  
  <!-- Navigation Bar -->
  <nav class="nav-bar">
    <ul class="nav-list">
      <div class="nav-left">
        <li><img src="assets/images/fish-logo2.png" alt="Logo" class="nav-logo"></li>
        <li><a href="index.html" class="nav-link">Game</a></li>
        <li><a href="Phishing.html" class="nav-link">Phishing?</a></li>
        <li><a href="scoreboard.html" class="nav-link">Score Board</a></li>
      </div>
    </ul>
  </nav>

  <main class="scene-viewport">
  <div class="container">
    <img src="assets/images/deskAndMousepad.png" alt="Background" class="background-img" />
    <img src="assets/images/fish2.gif" alt="Fish" class="fish-gif" />
    <img src="assets/images/robot.gif" alt="Robot" class="robot-gif" />

    <!-- Game Interface -->
    <div class="game-overlay">
      <div class="sidebar">
        <h3>Inbox</h3>
        <div class="email-list">
          <!-- Emails will be dynamically inserted here -->
        </div>
      </div>

      <div class="email-preview">


        <div id="scoreboard">
          <img src="assets/images/star.png" alt="Score Icon" id="score-icon" />
          <span id="score-text">Score: 0</span>
        </div>

        <div class="email-header" id="emailHeader"></div>
        <div class="email-body" id="emailBody"></div>

        <div class="email-actions">
          <button class="action-btn" id="reportBtn">Report Phishing</button>
          <button class="action-btn" id="trustBtn">Trust Email</button>
        </div>     

      </div>
    </div>
  </div>

  </main>
  <!-- Confirm Leave Modal -->
  <div id="leaveConfirmModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h2>Are you sure you want to leave?</h2>
      <p>If you leave now, your progress will not be saved.</p>
      <div class="modal-buttons">
        <button id="confirmLeaveBtn" class="modal-btn">Yes, Leave</button>
        <button id="cancelLeaveBtn" class="modal-btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- End Game Modal -->
  <div id="endGameModal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2 id="endTitle">Game Over</h2>
      <div id="endMessage"></div>
      <p id="scoreSaveStatus" role="status"></p>
      <div class="modal-buttons">
        <button id="playAgainBtn" class="modal-btn">Play Again</button>
        <a href="index.html" class="modal-btn return-home">Return Home</a>
      </div>
    </div>
  </div>

  <!-- Link JavaScript -->
  <script src="email-random.js"></script>
  <script src="playScript.js"></script>
</body>
</html>
