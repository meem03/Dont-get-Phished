<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="shortcut icon" type="x-icon" href="assets/images/fish-logo2.png">
  <title>Score Board | Do not get Phished!</title>
  <link rel="stylesheet" href="style.css" /><link rel="stylesheet" href="responsive.css" />

  <link rel="preload" href="assets/fonts/pixelon/Pixelon.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="scoreboard.css" />
  <script src="music.js" defer></script>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="nav-bar">
    <ul class="nav-list">
      <div class="nav-left">
        <li><img src="assets/images/fish-logo2.png" alt="Logo" class="nav-logo"></li>
        <li><a href="index.html" class="nav-link">Game</a></li>
        <li><a href="Phishing.html" class="nav-link">Phishing?</a></li>
        <li><a href="scoreboard.html" class="nav-link">Score Board</a></li>
      </div>
    </ul>
  </nav>

  <!-- Scoreboard -->
  <main class="scoreboard-container">
    <h1 class="scoreboard-title"><img src="assets/images/trophy-pixel.svg" class="scoreboard-trophy" alt="" width="48" height="48" />Top Players</h1>
    <table class="leaderboard">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Name</th>
          <th>Score</th>
        </tr>
      </thead>
        <tbody id="leaderboard-body">
          <!-- Scores will be populated dynamically via JavaScript -->
        </tbody>

    </table>
    <p id="leaderboard-status" role="status"></p>
  </main>
  <script src="scoreboard.js"></script>


</body>
</html>
